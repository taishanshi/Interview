// true：独立 App；false：Library，给壳工程 :app 依赖
def isApp = rootProject.ext.isMyDemoApplication

if (isApp) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.stone.hotfix'

android {
    namespace 'com.stone.interview'
    compileSdk 36

    defaultConfig {
        if (isApp) {
            applicationId 'com.stone.interview.mydemo'
        } else {
            consumerProguardFiles 'consumer-rules.pro'
        }
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        dataBinding true
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            if (isApp) {
                // 独立运行：带 LAUNCHER + Application 的 Manifest，并编译 MyApplication
                manifest.srcFile 'src/main/module/AndroidManifest.xml'
                java.srcDirs += 'src/module/java'
            } else {
                // 集成到壳工程：无 LAUNCHER，不要自己的 Application
                manifest.srcFile 'src/main/AndroidManifest.xml'
            }
        }
    }
}

kapt {
    arguments {
        arg('AROUTER_MODULE_NAME', project.getName())
    }
}

dependencies {
    implementation project(':common')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.dagger
    kapt libs.dagger.compiler
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    kapt libs.arouter.compiler
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging
    implementation libs.glide
    implementation libs.androidx.viewpager2
    implementation libs.androidx.recyclerview
    implementation libs.androidx.fragment.ktx
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
