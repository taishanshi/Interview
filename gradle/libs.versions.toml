material = "1.10.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
lifecycle = "2.8.7"
dagger = "2.59.2"
javassist = "3.30.2-GA"
hotfix = "1.0.3"
arouter = "1.5.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
